<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Coming Soon | Safe Step</title>
    <meta
      name="description"
      content="Safe Step is preparing something new. Our accessibility solutions will be available soon."
    />

    <link rel="icon" type="image/png" href="images/logo.png" />

    <!-- Raleway -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="comming.css" />
  </head>

  <body class="coming-soon-page">
    <!-- =========================
       TOP CONTROLS
  ========================== -->
    <div class="coming-controls">
      <button
        type="button"
        class="control-btn"
        id="darkToggle"
        aria-label="Toggle dark mode"
        title="Toggle dark mode"
      >
        <i data-lucide="moon"></i>
      </button>

      <button
        type="button"
        class="control-btn"
        id="rtlToggle"
        aria-label="Toggle RTL"
        title="Toggle RTL"
      >
        <i data-lucide="arrow-left-right"></i>
      </button>
    </div>

    <!-- =========================
       MAIN
  ========================== -->
    <main class="coming-wrapper">
      <div class="coming-card">
        <!-- =========================
           LOGO
      ========================== -->
        <div class="logo">
          <a href="index.html" aria-label="Safe Step Home">
            <img src="images/logo.png" alt="Safe Step Logo" />
          </a>

          <div class="logo-text" onclick="window.location.href = 'index.html'">
            <h1>
              <span class="safe">Safe</span><span class="step">Step</span>
            </h1>

            <p>Accessibility Solutions</p>
          </div>
        </div>

        <!-- =========================
           DECORATIVE 404 STYLE
      ========================== -->
        <div class="coming-decoration" aria-hidden="true">
          <span class="decoration-line line-one"></span>
          <span class="decoration-line line-two"></span>
          <span class="decoration-circle circle-one"></span>
          <span class="decoration-circle circle-two"></span>
        </div>

        <!-- =========================
           CONTENT
      ========================== -->
        <section class="coming-content">
          <div class="coming-icon" aria-hidden="true">
            <i data-lucide="construction"></i>
          </div>

          <span class="coming-eyebrow"> COMING SOON </span>

          <h2>
            Something Great<br />
            <span>Is On The Way.</span>
          </h2>

          <p class="coming-description">
            We are preparing something special to make accessibility simpler,
            safer, and more comfortable for every home.
          </p>

          <!-- =========================
             COUNTDOWN
        ========================== -->
          <div class="countdown" aria-label="Countdown timer">
            <div class="countdown-item">
              <strong id="days">00</strong>
              <span>Days</span>
            </div>

            <div class="countdown-separator">:</div>

            <div class="countdown-item">
              <strong id="hours">00</strong>
              <span>Hours</span>
            </div>

            <div class="countdown-separator">:</div>

            <div class="countdown-item">
              <strong id="minutes">00</strong>
              <span>Minutes</span>
            </div>

            <div class="countdown-separator">:</div>

            <div class="countdown-item">
              <strong id="seconds">00</strong>
              <span>Seconds</span>
            </div>
          </div>

          <!-- =========================
             ACTIONS
        ========================== -->
          <div class="coming-actions">
            <a href="index.html" class="coming-primary-btn">
              <i data-lucide="house"></i>
              <span>Back to Home</span>
            </a>

            <a href="contact.html" class="coming-secondary-btn">
              <i data-lucide="mail"></i>
              <span>Contact Us</span>
            </a>
          </div>

          <p class="coming-note">
            <i data-lucide="shield-check"></i>
            <span>Safe Step — Making every step safer.</span>
          </p>
        </section>
      </div>
    </main>

    <!-- =========================
       SCRIPTS
  ========================== -->
    <script src="global.js"></script>
    <script src="comming.js"></script>
  </body>
</html>
